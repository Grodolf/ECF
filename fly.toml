# fly.toml app configuration file generated for ecf on 2026-02-09T10:40:59+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ecf'
primary_region = 'cdg'

[build]
  dockerfile= 'Dockerfile'
  ignorefile = '.dockerignore'

[env]
  APP_ENV = 'production'
  APP_URL = 'https://ecf.fly.dev'

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health.php'
    protocol = 'http'

[[vm]]
  count = 1
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[mounts]
  source = "uploads_data"
  destination = "/var/www/html/public/uploads"
