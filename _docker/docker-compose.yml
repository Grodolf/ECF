services:
  web:
    build: .
    container_name: ECF-web
    restart: unless-stopped
    ports:
      - "9080:80"
    volumes:
      - ~/projets/ECF:/var/www/html
      - ./config/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=${APP_ENV}
      - DB_HOST=db
      - DB_NAME=${MARIADB_DATABASE}
      - DB_USER=${MARIADB_USER}
      - DB_PASS=${MARIADB_PASSWORD}
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_ROOT_USER}
      - MONGO_PASS=${MONGO_ROOT_PASSWORD}
      - MONGO_DATABASE=${MONGO_DATABASE}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
    depends_on:
      - db
      - mongodb
      - mailhog

  db:
    image: bitnami/mariadb:latest
    container_name: ECF-mariadb
    restart: unless-stopped
    ports:
      - "9033:3306"
    volumes:
      - mariadb_data:/bitnami/mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}

  mongodb:
    image: bitnami/mongodb:latest
    container_name: ECF-mongodb
    restart: unless-stopped
    ports:
      - "9017:27017"
    volumes:
      - mongo_data:/bitnami/mongodb
    environment:
      - MONGODB_ROOT_USER=${MONGO_ROOT_USER}
      - MONGODB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ECF-phpmyadmin
    restart: unless-stopped
    ports:
      - "9081:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=${MARIADB_USER}
      - PMA_PASSWORD=${MARIADB_PASSWORD}
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog
    container_name: ECF-mailhog
    restart: unless-stopped
    ports:
      - "9025:8025" # Interface web
      - "9026:1025" # SMTP

volumes:
  mariadb_data:
  mongo_data:
